<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מפת מענים · תוכנית עבודה בית ספרית</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Hebrew:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#141634;
  --indigo:#070A59;
  --indigo-700:#171C8C;
  --paper:#ECEEF4;
  --card:#FFFFFF;
  --magenta:#FF46E0;
  --magenta-deep:#C81FB0;
  --teal:#2E8896;
  --teal-strong:#1F6B78;
  --teal-dim:#E1F0F2;
  --purple:#7A5FB0;
  --purple-dim:#EDE7F6;
  --blue:#3E6FB1;
  --blue-dim:#E5EDF7;
  --slate:#5C6377;
  --line:#E2E4EC;
  --danger:#C0392B;
  --danger-dim:#FBE9E5;
  --shadow:0 1px 2px rgba(20,22,52,.05), 0 8px 24px rgba(20,22,52,.07);
  --radius:18px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Noto Sans Hebrew', Arial, sans-serif;
  min-height:100vh;
  line-height:1.55;
}
h1,h2,h3,.display{
  font-family:'Noto Sans Hebrew', Arial, sans-serif;
  font-weight:800;
  letter-spacing:-.01em;
  line-height:1.1;
}
button{font-family:inherit; cursor:pointer;}
a{color:var(--teal-strong);}
a:hover{color:var(--magenta-deep);}
::selection{background:var(--teal-dim);}

/* ---------- shell ---------- */
.app-topbar{
  position:sticky; top:0; z-index:20;
  background:#D5FCFC;
  color:var(--indigo);
  border-bottom:1px solid #B3E6EA;
  padding:12px 28px;
  display:flex; align-items:center; justify-content:space-between;
  gap:16px;
  box-shadow:0 4px 18px rgba(7,10,89,.08);
}
.brand{display:flex; align-items:center; gap:14px; flex:0 0 auto;}
.brand-logo{height:48px; width:auto; display:block; flex:0 0 auto;}
.brand-divider{width:1px; height:42px; background:rgba(16,16,88,.2); flex:0 0 auto;}
.brand-name{font-family:'Noto Sans Hebrew',sans-serif; font-size:21px; font-weight:800; line-height:1.1; white-space:nowrap;}
.brand-sub{font-size:12px; color:rgba(16,16,88,.7); margin-top:2px;}
.topbar-actions{display:flex; gap:8px 10px; align-items:center; flex-wrap:wrap; justify-content:flex-end; min-width:0;}
.pill{
  font-size:13px; padding:7px 14px; border-radius:999px; white-space:nowrap;
  border:1.5px solid rgba(16,16,88,.3); background:transparent; color:var(--indigo);
  transition:background .15s ease, border-color .15s ease;
}
.pill:hover{background:rgba(16,16,88,.07); border-color:var(--indigo);}
.pill-form-highlight{
  background:var(--magenta); border-color:var(--magenta);
  color:#fff !important; font-weight:800; text-decoration:none;
  box-shadow:0 2px 16px rgba(255,70,224,.45);
}
.pill-form-highlight:hover{background:var(--magenta-deep); border-color:var(--magenta-deep);}

.pill-link{
  border-color:rgba(122,95,176,.55); color:var(--purple) !important;
  text-decoration:none; font-weight:700;
}
.pill-link:hover{background:rgba(122,95,176,.1); border-color:var(--purple); color:var(--purple) !important;}

.wrap{max-width:1040px; margin:0 auto; padding:34px 24px 90px;}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex; align-items:center; gap:8px;
  border-radius:999px; border:1.5px solid transparent;
  padding:11px 22px; font-size:14.5px; font-weight:700;
  transition:transform .05s ease, background .15s ease, border-color .15s ease, filter .15s ease;
}
.btn:active{transform:translateY(1px);}
.btn-primary{background:var(--indigo); color:#fff;}
.btn-primary:hover{background:var(--indigo-700);}
.btn-ghost{background:#fff; color:var(--ink); border-color:var(--line);}
.btn-ghost:hover{border-color:var(--teal); color:var(--teal-strong);}
.btn-teal{background:var(--teal); color:#fff;}
.btn-teal:hover{background:var(--teal-strong);}
.btn-sm{padding:8px 16px; font-size:13px;}
.btn-danger-outline{background:#fff; color:var(--danger); border-color:#E7C4BE;}
.btn-danger-outline:hover{background:var(--danger-dim);}
.btn:disabled{opacity:.4; cursor:not-allowed;}

/* ---------- home ---------- */
.home-hero{margin-bottom:34px;}
.eyebrow{
  font-size:12px; letter-spacing:.6px;
  color:var(--teal-strong); font-weight:800; margin-bottom:8px;
}
.home-hero h1{font-size:38px; margin:0 0 12px; color:var(--ink);}
.home-hero p{color:var(--slate); font-size:15.5px; max-width:660px; margin:0;}

.school-grid{
  display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:16px; margin-top:22px;
}
.school-card{
  background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
  padding:20px 20px 18px; box-shadow:var(--shadow); cursor:pointer;
  display:flex; flex-direction:column; gap:10px; transition:border-color .15s ease, transform .12s ease, box-shadow .15s ease;
}
.school-card:hover{border-color:var(--teal); transform:translateY(-3px); box-shadow:0 12px 30px rgba(20,22,52,.12);}
.school-card-head{display:flex; align-items:flex-start; justify-content:space-between; gap:8px;}
.school-card h3{margin:0; font-size:18px; color:var(--ink);}
.delete-school-btn{
  background:transparent; border:1px solid transparent; border-radius:999px;
  padding:6px 12px; font-size:12px; color:var(--slate); align-self:flex-start; margin-top:auto;
}
.delete-school-btn:hover{background:var(--danger-dim); color:var(--danger); border-color:#E7C4BE;}
.badge{
  font-size:11px; font-weight:700; padding:4px 11px; border-radius:999px;
  background:var(--teal-dim); color:var(--teal-strong); white-space:nowrap;
}
.badge.new{background:rgba(255,70,224,.12); color:var(--magenta-deep);}
.school-meta{font-size:12.5px; color:var(--slate); display:flex; gap:10px; flex-wrap:wrap;}
.school-count{
  font-size:13px; color:var(--ink); font-weight:600; margin-top:4px;
  display:flex; align-items:center; gap:6px;
}
.school-count .n{
  background:var(--indigo); color:#fff; border-radius:999px; padding:2px 11px; font-size:12.5px; font-weight:700;
}
.new-school-card{
  border:1.5px dashed #C6CAD8; background:transparent; box-shadow:none;
  display:flex; align-items:center; justify-content:center; flex-direction:column; gap:8px;
  color:var(--slate); min-height:120px;
}
.new-school-card:hover{border-color:var(--teal); color:var(--teal-strong); transform:translateY(-3px); box-shadow:none;}
.new-school-card .plus{font-size:28px; line-height:1; color:var(--magenta);}

.empty-state{
  border:1px dashed #C6CAD8; border-radius:var(--radius); padding:40px 24px;
  text-align:center; color:var(--slate); margin-top:20px;
}

/* ---------- wizard ---------- */
.wizard-header{display:flex; align-items:center; justify-content:space-between; margin-bottom:22px; gap:14px; flex-wrap:wrap;}
.wizard-header h2{margin:0; font-size:26px;}
.steps-track{display:flex; gap:6px; margin-bottom:28px;}
.step-dot{
  flex:1; height:6px; border-radius:999px; background:var(--line); transition:background .2s ease;
}
.step-dot.done{background:var(--teal);}
.step-dot.active{background:var(--magenta);}

.card{
  background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
  padding:28px 28px 24px; box-shadow:var(--shadow); margin-bottom:18px;
}
.q-label{font-size:19px; font-weight:800; margin:0 0 4px; color:var(--ink);}
.q-hint{font-size:13.5px; color:var(--slate); margin:0 0 16px;}

.field{margin-bottom:18px;}
.field label{display:block; font-size:13px; font-weight:700; color:var(--ink); margin-bottom:6px;}
.field input[type=text]{
  width:100%; padding:12px 14px; border-radius:12px; border:1.5px solid var(--line);
  font-size:14.5px; font-family:inherit; background:#fff;
}
.field input[type=text]:focus{outline:2px solid var(--teal); outline-offset:1px; border-color:var(--teal);}
.field textarea{
  width:100%; padding:12px 14px; border-radius:12px; border:1.5px solid var(--line);
  font-size:14.5px; font-family:inherit; background:#fff; resize:vertical; min-height:80px;
}
.field textarea:focus{outline:2px solid var(--teal); outline-offset:1px; border-color:var(--teal);}
.field input[type=file]{
  font-size:13px; font-family:inherit;
}
.attachment-item{
  display:flex; align-items:center; gap:10px; padding:9px 13px; border:1px solid var(--line);
  border-radius:12px; background:#fff; margin-bottom:8px; font-size:13px;
}
.attachment-item a{color:var(--teal-strong); font-weight:700; text-decoration:none;}
.attachment-item a:hover{text-decoration:underline;}
.att-size{color:var(--slate); font-size:12px;}
.discussion-note{font-size:12.5px; color:var(--slate); font-weight:400;}

.choice-grid{display:flex; flex-wrap:wrap; gap:9px;}
.chip-toggle{
  border:1.5px solid var(--line); background:#fff; border-radius:999px;
  padding:10px 17px; font-size:14px; color:var(--ink); font-weight:600;
  transition:all .12s ease;
}
.chip-toggle:hover{border-color:var(--teal); color:var(--teal-strong);}
.chip-toggle.on{background:var(--indigo); color:#fff; border-color:var(--indigo);}
.chip-toggle:focus-visible{outline:2px solid var(--teal); outline-offset:2px;}

.radio-row{display:flex; flex-direction:column; gap:8px;}
.radio-opt{
  display:flex; align-items:center; gap:10px; border:1.5px solid var(--line); border-radius:14px;
  padding:12px 15px; cursor:pointer; font-size:14px;
}
.radio-opt.on{border-color:var(--magenta); background:rgba(255,70,224,.07);}
.radio-opt input{accent-color:var(--magenta);}

.wizard-nav{display:flex; justify-content:space-between; margin-top:6px;}

/* ---------- result cards ---------- */
.result-list{display:flex; flex-direction:column; gap:12px;}
.match-card{
  background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
  padding:18px 20px; display:flex; gap:14px; align-items:flex-start; box-shadow:var(--shadow);
  transition:border-color .15s ease;
}
.match-card:hover{border-color:#C6CAD8;}
.match-check{margin-top:4px; width:19px; height:19px; accent-color:var(--teal); flex:0 0 auto; cursor:pointer;}
.match-body{flex:1; min-width:0;}
.match-top{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:4px;}
.match-name{font-weight:800; font-size:16px; color:var(--ink);}
.cat-tag{font-size:11px; padding:3px 11px; border-radius:999px; font-weight:700;}
.cat-tag.פדגוגי{background:var(--teal-dim); color:var(--teal-strong);}
.cat-tag.מנטלי{background:rgba(255,70,224,.12); color:var(--magenta-deep);}
.cat-tag.משולב_ידע_ומנטלי{background:var(--purple-dim); color:var(--purple);}
.cat-tag.חיבור_לטק{background:var(--blue-dim); color:var(--blue);}
.match-desc{font-size:13.5px; color:var(--slate); margin:2px 0 8px;}
.match-why{
  font-size:12.5px; background:var(--teal-dim); border-radius:12px; padding:9px 12px; color:var(--teal-strong);
  display:flex; gap:6px; align-items:flex-start;
}
.match-meta{display:flex; gap:12px; margin-top:8px; font-size:12px; color:var(--slate); flex-wrap:wrap;}
.warn-note{
  font-size:12px; color:var(--danger); background:var(--danger-dim); border-radius:999px;
  padding:6px 12px; margin-top:8px; display:inline-block;
}

.section-title{font-size:16px; font-weight:800; margin:28px 0 10px; color:var(--ink);}
.more-toggle{
  background:transparent; border:1.5px dashed #C6CAD8; border-radius:14px; padding:11px 14px;
  font-size:13.5px; color:var(--slate); width:100%; text-align:center; margin-top:6px; font-weight:600;
}
.more-toggle:hover{border-color:var(--teal); color:var(--teal-strong);}

/* ---------- plan table ---------- */
.plan-toolbar{display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:18px; flex-wrap:wrap;}
.quota-alert{
  border:1px solid #E7C4BE; background:var(--danger-dim); color:var(--danger);
  border-radius:14px; padding:11px 15px; font-size:13px; margin-bottom:14px;
}
table.plan-table{width:100%; border-collapse:collapse; background:#fff; border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow);}
table.plan-table th{
  text-align:right; font-size:12px; letter-spacing:.3px;
  color:var(--slate); padding:14px 15px; border-bottom:1px solid var(--line); background:#EEF0F7; font-weight:700;
}
table.plan-table td{padding:14px 15px; border-bottom:1px solid var(--line); font-size:13.5px; vertical-align:top;}
table.plan-table tr:last-child td{border-bottom:none;}
.remove-btn{
  background:transparent; border:1.5px solid var(--line); border-radius:999px; color:var(--danger);
  font-size:12px; padding:6px 13px; font-weight:600;
}
.remove-btn:hover{background:var(--danger-dim); border-color:#E7C4BE;}
.plan-empty{padding:40px; text-align:center; color:var(--slate); background:#fff; border:1px solid var(--line); border-radius:var(--radius);}

.quota-badge{
  display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:700;
  padding:4px 11px; border-radius:999px; margin-top:6px;
  background:var(--teal-dim); color:var(--teal-strong);
}
.status-pill{
  display:inline-flex; align-items:center; font-size:11px; font-weight:700;
  padding:3px 11px; border-radius:999px; background:#EEF0F7; color:var(--slate);
  border:1px solid var(--line);
}
.status-pill.live{background:var(--teal-dim); color:var(--teal-strong); border-color:#BFDDE2;}
.status-pill.planned{background:#FDF3E3; color:#8A5A12; border-color:#EBD9BC;}
.sheet-overlay{
  position:fixed; inset:0; z-index:60; background:rgba(20,22,52,.55);
  display:flex; align-items:center; justify-content:center; padding:28px;
}
.sheet-box{
  background:#fff; border-radius:var(--radius); box-shadow:0 24px 60px rgba(20,22,52,.35);
  max-width:860px; width:100%; max-height:100%; display:flex; flex-direction:column; overflow:hidden;
}
.sheet-head{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:15px 20px; border-bottom:1px solid var(--line); background:#F6F7FB; flex:0 0 auto;
}
.sheet-title{font-size:16px; font-weight:800; color:var(--ink);}
.sheet-close{
  border:1.5px solid var(--line); background:#fff; border-radius:999px;
  width:32px; height:32px; font-size:14px; color:var(--slate); line-height:1;
}
.sheet-close:hover{border-color:var(--danger); color:var(--danger); background:var(--danger-dim);}
.sheet-body{overflow:auto; padding:18px; background:#EEF0F7;}
.sheet-body img{display:block; width:100%; height:auto; border-radius:8px; box-shadow:0 2px 12px rgba(20,22,52,.12);}
@media print{.sheet-overlay{display:none !important;}}

.exam-note{
  margin-top:8px; font-size:12px; line-height:1.5; color:var(--teal-strong);
  background:var(--teal-dim); border-radius:10px; padding:7px 11px;
}
.exam-group{margin-bottom:18px;}
.exam-group:last-of-type{margin-bottom:0;}
.exam-group-title{font-size:14px; font-weight:800; color:var(--ink); margin-bottom:6px;}
.exam-row{
  display:grid; grid-template-columns:110px 60px 1fr; gap:10px; align-items:baseline;
  padding:9px 0; border-bottom:1px solid var(--line); font-size:14px;
}
.exam-date{font-weight:800; color:var(--indigo); direction:ltr; text-align:right;}
.exam-day{color:var(--slate); font-size:12.5px;}
.exam-subj{color:var(--ink);}

.info-link{
  display:inline-flex; align-items:center; border-radius:999px;
  border:1.5px solid var(--line); background:#fff; color:var(--ink) !important;
  padding:6px 15px; font-size:12.5px; font-weight:700; text-decoration:none;
  transition:border-color .15s ease, color .15s ease, background .15s ease;
}
.info-link:hover{border-color:var(--teal); color:var(--teal-strong) !important; background:var(--teal-dim);}

.quota-badge.full{background:var(--danger-dim); color:var(--danger);}
.match-card.blocked{opacity:.55;}
.match-card.blocked .match-check{cursor:not-allowed;}
.btn-form-highlight{
  background:var(--magenta) !important; color:#fff !important;
  border-color:var(--magenta) !important; font-weight:800;
  box-shadow:0 2px 16px rgba(255,70,224,.45);
}
.btn-form-highlight:hover{background:var(--magenta-deep) !important; border-color:var(--magenta-deep) !important;}

footer.printfoot{display:none;}
@media print{
  .app-topbar,.plan-toolbar,.remove-btn,.no-print{display:none !important;}
  body{background:#fff;}
  .wrap{padding:0; max-width:100%;}
  table.plan-table{box-shadow:none;}
}
@media (max-width:600px){
  .app-topbar{padding:12px 16px; flex-wrap:wrap;}
  .topbar-actions{flex-wrap:wrap;}
  .wrap{padding:22px 14px 60px;}
  .home-hero h1{font-size:28px;}
  .brand-sub{display:none;}
}
</style>
</head>

function openInfoSheet(id){
  const s = INFO_SHEETS[id];
  if(!s) return;
  const ov = document.createElement('div');
  ov.className = 'sheet-overlay';
  ov.innerHTML = '<div class="sheet-box" role="dialog" aria-modal="true">'
    + '<div class="sheet-head"><span class="sheet-title">' + s.title + '</span>'
    + '<button class="sheet-close" aria-label="סגור">✕</button></div>'
    + '<div class="sheet-body"><img src="' + s.img + '" alt="' + s.title + '"></div>'
    + '</div>';
  const close = ()=>{ ov.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = ev=>{ if(ev.key==='Escape') close(); };
  ov.addEventListener('click', ev=>{ if(ev.target===ov) close(); });
  ov.querySelector('.sheet-close').addEventListener('click', close);
  document.addEventListener('keydown', onKey);
  document.body.appendChild(ov);
}

function openExamsDialog(){
  const ov = document.createElement('div');
  ov.className = 'sheet-overlay';
  ov.innerHTML = `
    <div class="sheet-box" role="dialog" aria-modal="true" style="max-width:620px;">
      <div class="sheet-head">
        <span class="sheet-title">לוח מועדים · מתמטיקה, פיזיקה ומדעי המחשב</span>
        <button class="sheet-close" aria-label="סגור">✕</button>
      </div>
      <div class="sheet-body" style="background:#fff;">
        ${EXAM_GROUPS.map(g=>`
          <div class="exam-group">
            <div class="exam-group-title">${g.title}</div>
            ${g.rows.map(r=>`
              <div class="exam-row">
                <span class="exam-date">${r.d}</span>
                <span class="exam-day">${r.day}</span>
                <span class="exam-subj">${r.subj}</span>
              </div>`).join('')}
          </div>`).join('')}
        <p class="q-hint" style="margin:16px 0 0;">לפי לוחות אגף בכיר בחינות (טיוטה 12.07.2026). המועדים כפופים לשינויים.</p>
      </div>
    </div>`;
  const close = ()=>{ ov.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = ev=>{ if(ev.key==='Escape') close(); };
  ov.addEventListener('click', ev=>{ if(ev.target===ov) close(); });
  ov.querySelector('.sheet-close').addEventListener('click', close);
  document.addEventListener('keydown', onKey);
  document.body.appendChild(ov);
}
document.addEventListener('click', e=>{ if(e.target.closest && e.target.closest('#btnExams')) openExamsDialog(); });

function infoLinkHtml(id){
  if(INFO_SHEETS[id]){
    return `<a class="info-link" href="#" onclick="event.preventDefault();event.stopPropagation();openInfoSheet('${id}')">מידע נוסף</a>`;
  }
  const url = INFO_LINKS[id];
  if(!url) return '';
  return `<a class="info-link" href="${url}" target="_blank" rel="noopener" onclick="event.stopPropagation()">מידע נוסף</a>`;
}

/* quota / registration constants */
const QUOTA_GROUP_MAX = { bootcamp: 2 };
const MANE_ENTRY_FORM_URL = 'https://wkf.ms/4e42Kre';

function getQuotaMeta(item, school){
  if(item.groupKey && QUOTA_GROUP_MAX[item.groupKey]){
    return { max: QUOTA_GROUP_MAX[item.groupKey] };
  }
  if(item.quotaBySectorStatus){
    const sectorKey = (school.sector||'').includes('ערב') || (school.sector||'').includes('בדוא') ? 'ערבי' : 'יהודי';
    const byStatus = item.quotaBySectorStatus[sectorKey] || item.quotaBySectorStatus['יהודי'];
    const max = byStatus[school.status] ?? Math.max(...Object.values(byStatus));
    return { max };
  }
  if(item.quotaByStatus){
    const max = item.quotaByStatus[school.status] ?? Math.max(...Object.values(item.quotaByStatus));
    return { max };
  }
  return null;
}
function quotaUsage(item, school){
  const qm = getQuotaMeta(item, school);
  if(!qm || !school) return null;
  let used = 0;
  Object.values(school.grades||{}).forEach(g=>{
    (g.plan||[]).forEach(p=>{
      const pit = ITEMS.find(i=>i.id===p.id);
      if(!pit) return;
      const same = item.quotaPool ? (pit.quotaPool===item.quotaPool)
                 : (item.groupKey ? (pit.groupKey===item.groupKey) : (pit.id===item.id));
      if(same) used += (p.qty||1);
    });
  });
  return {max:qm.max, used, remaining:Math.max(0, qm.max-used), full: used>=qm.max};
}
function quotaCounterHtml(item, school){
  const u = quotaUsage(item, school);
  if(!u) return '';
  const scopeTxt = item.groupKey==='bootcamp' ? 'בוטקאמפים בתוכנית בית הספר'
    : (item.quotaPool==='summit_day' ? 'ימי שיא / סיור בתוכנית בית הספר' : 'בתוכנית בית הספר');
  return `<div class="quota-badge ${u.full?'full':''}">${u.full?'⛔':'✓'} ${u.used} מתוך ${u.max} ${scopeTxt}${u.full?' – המכסה מולאה':` · נותרו ${u.remaining}`}</div>`;
}
function quotaBadgeText(qm){
  return `מוגבל ל-${qm.max} בסה"כ בבית הספר (על פני כל השכבות יחד)`;
}
function quotaBadgeTextGeneric(item){
  if(item.groupKey && QUOTA_GROUP_MAX[item.groupKey]){
    return `מוגבל ל-${QUOTA_GROUP_MAX[item.groupKey]} בסה"כ בבית הספר (בכל האורכים גם יחד)`;
  }
  if(item.quotaBySectorStatus){
    const fmt = s => Object.entries(item.quotaBySectorStatus[s]).map(([k,v])=>`${k} ${v}`).join('/');
    const pool = item.quotaPool==='summit_day' ? ' – משותפת ליום שיא ויום סיור' : '';
    return `מכסה לפי מגזר וסטטוס (יהודי: ${fmt('יהודי')} · ערבי: ${fmt('ערבי')})${pool}`;
  }
  if(item.quotaByStatus){
    const parts = Object.entries(item.quotaByStatus).map(([k,v])=>`${k}: עד ${v}`).join(' · ');
    return `מכסה בבית הספר לפי סטטוס (${parts})`;
  }
  return null;
}

let schools = [];

let resultsShownAll = false;

/* Persistence: this file is a standalone downloadable/hosted HTML page (not a claude.ai
   in-chat artifact), so we use the browser's own localStorage — it persists on this device
   between visits, as long as the file is opened from the same URL/location each time. */
const STORAGE_PREFIX = 'maane_map__';

async function loadSchools(){
  try{
    const raw = localStorage.getItem(STORAGE_PREFIX+'schools-list');
    schools = raw ? JSON.parse(raw) : [];
  }catch(e){ schools = []; }
  let changed = false;
  for(const s of schools){
    if(s.gradeCount===undefined){
      const full = await loadSchool(s.id); // loadSchool migrates the shape internally
      if(full){
        s.gradeCount = Object.keys(full.grades||{}).length;
        await saveSchool(full); // persist the migrated shape
      } else {
        s.gradeCount = 0;
      }
      delete s.planCount;
      changed = true;
    }
  }
  if(changed) await saveSchoolsList();
}
function migrateSchoolShape(school){
  if(!school.grades){
    school.grades = {};
    if((school.plan && school.plan.length) || school.discussion){
      school.grades[SCHOOLWIDE_KEY] = {
        plan: school.plan || [], discussion: school.discussion || null,
        createdAt: school.createdAt || Date.now(), updatedAt: school.updatedAt || Date.now(),
      };
    }
  }
  delete school.plan;
  delete school.discussion;
  delete school.planCount;
  return school;
}
function updateSchoolsListEntry(school){
  const gradeCount = Object.keys(school.grades||{}).length;
  const existing = schools.find(s=>s.id===school.id);
  if(existing){
    existing.updatedAt = school.updatedAt; existing.gradeCount = gradeCount;
    existing.name = school.name; existing.sector = school.sector; existing.status = school.status;
  } else {
    schools.push({id:school.id, name:school.name, sector:school.sector, status:school.status, updatedAt:school.updatedAt, gradeCount});
  }
}
async function saveSchoolsList(){
  try{ localStorage.setItem(STORAGE_PREFIX+'schools-list', JSON.stringify(schools)); }
  catch(e){ alert('שמירת הנתונים נכשלה בדפדפן הזה. ודאו שהאתר נפתח כקובץ רגיל (לא במצב פרטי) ושיש מקום אחסון פנוי.'); }
}
async function loadSchool(id){
  try{
    const raw = localStorage.getItem(STORAGE_PREFIX+'school:'+id);
    if(!raw) return null;
    return migrateSchoolShape(JSON.parse(raw));
  }catch(e){ return null; }
}
async function saveSchool(school){
  try{ localStorage.setItem(STORAGE_PREFIX+'school:'+school.id, JSON.stringify(school)); }
  catch(e){ alert('שמירת תוכנית העבודה נכשלה בדפדפן הזה.'); }
}
async function deleteSchool(id){
  try{ localStorage.removeItem(STORAGE_PREFIX+'school:'+id); }catch(e){}
  schools = schools.filter(s=>s.id!==id);
  await saveSchoolsList();
}

function uid(){ return 's_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

/* =========================================================
   RECOMMENDATION ENGINE
   ========================================================= */
function itemAgeOverlap(item, ages){
  if(!item.ages || item.ages.length===0) return true; // staff/manager items – age agnostic
  if(!ages || ages.length===0) return true;
  return item.ages.some(a=>ages.includes(a));
}
function itemAudienceMatch(item, audiences){
  if(!audiences || audiences.length===0) return true;
  return item.audience.some(a=>audiences.includes(a));
}
function itemSectorMatch(item, sector){
  if(!sector || item.sector.includes('לכולם')) return true;
  return item.sector.includes(sector);
}
function needMatchesContext(need, gradeKey){
  if(need.ages === 'all') return true;
  if(!gradeKey || gradeKey === SCHOOLWIDE_KEY) return true;
  return need.ages.includes(gradeKey);
}
function availableNeeds(){
  return NEEDS.filter(n=>needMatchesContext(n, wizardDraft.gradeKey));
}
function computeCandidates(answers){
  const {ages, audiences, needs, sector, followups} = answers;
  const filtered = ITEMS.filter(it =>
    it.audience.includes('תלמידים') &&
    itemAudienceMatch(it, audiences) &&
    itemAgeOverlap(it, ages) &&
    itemSectorMatch(it, sector)
  );
  const scored = filtered.map(it=>{
    const matchedNeeds = (it.needs||[]).filter(n=>needs.includes(n));
    let score = matchedNeeds.length*10;
    if(needs.includes('knowledge_gap') && (it.category==='פדגוגי' || it.groupKey==='bootcamp')){
      score += 10;
      if(!matchedNeeds.includes('knowledge_gap')) matchedNeeds.push('knowledge_gap');
    }
    if(followups.shortageSize==='small' && ['virtual_high_school','virtual_class_physics'].includes(it.id)) score+=6;
    if(followups.shortageSize==='wholeClass' && it.id==='tech_track') score+=6;
    return {item:it, score, matchedNeeds};
  }).filter(s=> needs.length===0 || s.matchedNeeds.length>0 || s.score>0);
  scored.sort((a,b)=> b.score-a.score);
  return scored;
}
function explainMatch(scoredEntry, answers){
  const {item, matchedNeeds} = scoredEntry;
  const parts = [];
  if(matchedNeeds.length){
    parts.push('עונה על הצורך: ' + matchedNeeds.map(n=>NEED_LABEL[n]).join(', '));
  }
  if(item.ages && item.ages.length){
    const overlap = item.ages.filter(a=>answers.ages.includes(a));
    if(overlap.length) parts.push('מותאם לשכבות ' + overlap.join('\u2019, ') + '\u2019');
  }
  if(!parts.length) parts.push('רלוונטי לפי מגזר וסטטוס בית הספר');
  return parts.join(' · ');
}

/* ---------------- WIZARD ---------------- */
const WIZARD_STEPS_NEW_SCHOOL = ['identity','grade','needs','followups','review'];
const WIZARD_STEPS_NEW_GRADE = ['grade','needs','followups','review'];
const WIZARD_STEPS_EXISTING_GRADE = ['needs','followups','review'];

function currentSteps(){
  if(wizardDraft.isNewSchool) return WIZARD_STEPS_NEW_SCHOOL;
  if(wizardDraft.isNewGrade) return WIZARD_STEPS_NEW_GRADE;
  return WIZARD_STEPS_EXISTING_GRADE;
}

function renderWizard(app){
  const steps = currentSteps();
  const stepKey = steps[wizardStep];
  const dots = steps.map((s,i)=>`<div class="step-dot ${i<wizardStep?'done':(i===wizardStep?'active':'')}"></div>`).join('');

  let headerTitle;
  if(wizardDraft.isNewSchool) headerTitle = 'בית ספר חדש';
  else if(wizardDraft.isNewGrade) headerTitle = 'הוספת שכבה · '+escapeHtml(wizardDraft.name);
  else headerTitle = 'הוספת מענים · '+escapeHtml(wizardDraft.name)+' · '+escapeHtml(gradeLabel(wizardDraft.gradeKey));

  app.innerHTML = `
    <div class="wizard-header">
      <h2>${headerTitle}</h2>
      <button class="btn btn-ghost btn-sm" id="cancelWizard">ביטול</button>
    </div>
    <div class="steps-track">${dots}</div>
    <div id="stepHost"></div>
    <div class="wizard-nav">
      <button class="btn btn-ghost" id="backBtn" ${wizardStep===0?'disabled':''}>הקודם</button>
      <button class="btn btn-primary" id="nextBtn">${stepKey==='review' ? 'קבל המלצות מענים' : 'הבא'}</button>
    </div>
  `;
  renderWizardStep(stepKey);

  document.getElementById('cancelWizard').addEventListener('click', async ()=>{
    if(wizardDraft.isNewSchool){ view='home'; render(); return; }
    const school = await loadSchool(wizardDraft.schoolId);
    if(school){ window.__activeSchool = school; view='schoolDetail'; } else { view='home'; }
    render();
  });
  document.getElementById('backBtn').addEventListener('click', ()=>{ wizardStep=Math.max(0,wizardStep-1); render(); });
  document.getElementById('nextBtn').addEventListener('click', onWizardNext);
}

function toggleArrVal(arr,val){
  const i=arr.indexOf(val);
  if(i>-1) arr.splice(i,1); else arr.push(val);
}

async function onWizardNext(){
  const steps = currentSteps();
  const stepKey = steps[wizardStep];
  if(stepKey==='identity' && !wizardDraft.name.trim()){
    alert('נא להזין שם בית ספר');
    return;
  }
  if(stepKey==='grade' && !wizardDraft.gradeKey){
    alert('נא לבחור שכבה');
    return;
  }
  if(stepKey==='review'){
    await finalizeWizardToResults();
    return;
  }
  wizardStep = Math.min(steps.length-1, wizardStep+1);
  render();
}

async function finalizeWizardToResults(){
  let school;
  if(wizardDraft.isNewSchool){
    school = {
      id: wizardDraft.schoolId, name: wizardDraft.name, sector: wizardDraft.sector,
      status: wizardDraft.status, grades: {}, createdAt: Date.now(), updatedAt: Date.now(),
    };
  } else {
    school = await loadSchool(wizardDraft.schoolId);
    if(!school) return;
  }
  currentSchoolId = school.id;
  window.__activeSchool = school;
  window.__activeGradeKey = wizardDraft.gradeKey;
  window.__activeAnswers = {
    ages: wizardDraft.gradeKey===SCHOOLWIDE_KEY ? [] : [wizardDraft.gradeKey],
    audiences: wizardDraft.audiences, needs: wizardDraft.needs,
    sector: school.sector, followups: wizardDraft.followups
  };
  if(school.grades && school.grades[wizardDraft.gradeKey]){
    school.grades[wizardDraft.gradeKey].lastAnswers = window.__activeAnswers;
  }
  view='results';
  resultsShownAll = false;
  render();
}

/* ---------------- RESULTS ---------------- */
function renderResults(app){
  const school = window.__activeSchool;
  const gradeKey = window.__activeGradeKey;
  const answers = window.__activeAnswers;
  const candidates = computeCandidates(answers);
  const gradeObj = (school.grades && school.grades[gradeKey]) || {plan:[]};
  const alreadyIn = new Set((gradeObj.plan||[]).map(p=>p.id));
  const top = candidates.filter(c=>!alreadyIn.has(c.item.id));
  const primary = top.slice(0,8);
  const more = top.slice(8);

  app.innerHTML = `
    <div class="wizard-header">
      <h2>מענים מומלצים · ${escapeHtml(school.name)} · ${escapeHtml(gradeLabel(gradeKey))}</h2>
      <button class="btn btn-ghost btn-sm" id="backToWizard">חזרה לשאלות</button>
    </div>

    <div class="section-title">מומלצים במיוחד עבור בית הספר</div>
    <div class="result-list" id="primaryList"></div>
    ${more.length? `<button class="more-toggle" id="moreBtn">הצג עוד ${more.length} מענים רלוונטיים</button>
      <div class="result-list" id="moreList" style="display:none; margin-top:12px;"></div>` : ''}

    <div class="section-title">שאר המאגר (לבחירה חופשית)</div>
    <button class="more-toggle" id="allBtn">${resultsShownAll?'הסתר את שאר המאגר':'הצג את שאר המענים במאגר'}</button>
    <div class="result-list" id="allList" style="display:${resultsShownAll?'flex':'none'}; margin-top:12px;"></div>

    <div class="wizard-nav" style="margin-top:26px;">
      <button class="btn btn-ghost" id="prevToWizard">הקודם</button>
      <div style="display:flex; gap:10px;">
        <button class="btn btn-ghost" id="cancelResults">ביטול</button>
        <button class="btn btn-primary" id="saveToPlanBtn">הוסף לתוכנית העבודה</button>
      </div>
    </div>
  `;

  renderMatchList(document.getElementById('primaryList'), primary, answers, true);
  if(more.length){
    renderMatchList(document.getElementById('moreList'), more, answers, true);
    document.getElementById('moreBtn').addEventListener('click', (e)=>{
      const l = document.getElementById('moreList');
      const isHidden = l.style.display==='none';
      l.style.display = isHidden?'flex':'none';
      e.target.textContent = isHidden? 'הסתר מענים נוספים' : `הצג עוד ${more.length} מענים רלוונטיים`;
    });
  }

  /* The catalog list must not repeat anything already shown in the two
     recommendation lists above it. */
  const shownAbove = new Set([...primary, ...more].map(e=>e.item.id));
  const allEntries = ITEMS.filter(it=>it.audience.includes('תלמידים') && !alreadyIn.has(it.id) && !shownAbove.has(it.id)).map(it=>({item:it, matchedNeeds:[]}));
  renderMatchList(document.getElementById('allList'), allEntries, answers, false);
  document.getElementById('allBtn').addEventListener('click', ()=>{
    resultsShownAll = !resultsShownAll;
    render();
  });

  document.getElementById('backToWizard').addEventListener('click', ()=>{ view='wizard'; render(); });
  document.getElementById('prevToWizard').addEventListener('click', ()=>{ view='wizard'; render(); });
  document.getElementById('cancelResults').addEventListener('click', ()=>{ view='home'; render(); });
  document.getElementById('saveToPlanBtn').addEventListener('click', commitSelectionsToPlan);
}

function renderMatchList(host, entries, answers, withExplain){
  const school = window.__activeSchool;

async function commitSelectionsToPlan(){
  const school = window.__activeSchool;
  const gradeKey = window.__activeGradeKey;
  const checked = Array.from(document.querySelectorAll('.match-check:checked')).map(c=>c.getAttribute('data-id'));
  if(checked.length===0){ alert('לא נבחרו מענים – ניתן לסמן וי בתיבות ולנסות שוב, או ללחוץ ביטול.'); return; }
  if(!school.grades) school.grades = {};
  if(!school.grades[gradeKey]) school.grades[gradeKey] = {plan:[], discussion:null, createdAt:Date.now(), updatedAt:Date.now()};
  const gradeObj = school.grades[gradeKey];
  gradeObj.plan = gradeObj.plan || [];
  const blockedNames = [];
  checked.forEach(id=>{
    const it = ITEMS.find(i=>i.id===id);
    if(!it) return;
    if(gradeObj.plan.some(p=>p.id===id)) return;
    const u = quotaUsage(it, school);
    if(u && u.full){ blockedNames.push(it.name); return; }
    gradeObj.plan.push({id, addedAt:Date.now(), qty:1});
  });
  if(blockedNames.length){
    alert('המענים הבאים לא נוספו – המכסה בבית הספר מולאה:\n· ' + blockedNames.join('\n· '));
  }
  gradeObj.lastAnswers = window.__activeAnswers || gradeObj.lastAnswers || null;
  gradeObj.updatedAt = Date.now();
  school.updatedAt = Date.now();
  await saveSchool(school);
  updateSchoolsListEntry(school);
  await saveSchoolsList();
  window.__activeSchool = school;
  view='plan';
  render();
}

const MAX_SINGLE_FILE = 4*1024*1024;   // 4MB per file
const MAX_TOTAL_ATTACH = 8*1024*1024;  // 8MB combined per school

function ensureDiscussion(gradeObj){
  if(!gradeObj.discussion){
    gradeObj.discussion = {
      expectedParticipants:'', attendancePercent:'', gradeDetails:'', goals:'',
      tenufaExam:null, tenufaDetails:'', achievementGaps:'', altAssessment:null,
      attachments:[]
    };
  }
  if(!gradeObj.discussion.attachments) gradeObj.discussion.attachments = [];
  return gradeObj.discussion;
}

function formatBytes(bytes){
  if(bytes < 1024) return bytes+' B';
  if(bytes < 1024*1024) return Math.round(bytes/1024)+' KB';
  return (bytes/(1024*1024)).toFixed(1)+' MB';
}

function readFileAsDataURL(file){
  return new Promise((resolve,reject)=>{
    const r = new FileReader();
    r.onload = ()=> resolve(r.result);
    r.onerror = ()=> reject(r.error);
    r.readAsDataURL(file);
  });
}

      <button class="btn btn-primary no-print" id="dSaveBtn" style="margin-top:8px;">שמור פרטי רקע</button>
      <span id="dSaveStatus" style="font-size:12.5px; color:var(--teal); margin-right:12px;"></span>
    </div>
  `;

  const bind = (id, field) => {
    const elx = host.querySelector('#'+id);
    if(elx) elx.addEventListener('input', ()=>{ d[field] = elx.value; });
  };
  bind('dExpected','expectedParticipants');
  bind('dAttendance','attendancePercent');
  bind('dGrade','gradeDetails');
  bind('dGoals','goals');
  bind('dTenufaDetails','tenufaDetails');
  bind('dAchievement','achievementGaps');

  host.querySelectorAll('#dTenufaGroup .chip-toggle').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const v = btn.getAttribute('data-val');
      d.tenufaExam = v==='yes' ? true : (v==='no' ? false : null);
      renderDiscussionCard(host, school, gradeKey);
    });
  });
  host.querySelectorAll('#dAltGroup .chip-toggle').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const v = btn.getAttribute('data-val');
      d.altAssessment = (v==='yes');
      renderDiscussionCard(host, school, gradeKey);
    });
  });

  host.querySelector('#dFileInput')?.addEventListener('change', async (e)=>{
    const files = Array.from(e.target.files || []);
    for(const f of files){
      if(f.size > MAX_SINGLE_FILE){
        alert(`הקובץ "${f.name}" גדול מ-4MB ולא יתווסף. מוטב לשמור אותו בדרייב משותף ולהוסיף קישור בשדה הטקסט החופשי.`);
        continue;
      }
      const currentTotal = d.attachments.reduce((s,a)=>s+a.size,0);
      if(currentTotal + f.size > MAX_TOTAL_ATTACH){
        alert(`הוספת הקובץ "${f.name}" תעבור את המכסה הכוללת (${formatBytes(MAX_TOTAL_ATTACH)}) לבית ספר זה. הסירו קובץ קיים או שמרו קבצים כבדים בדרייב משותף.`);
        continue;
      }
      try{
        const dataUrl = await readFileAsDataURL(f);
        d.attachments.push({name:f.name, size:f.size, type:f.type, dataUrl, addedAt:Date.now()});
      }catch(err){
        alert('שגיאה בקריאת הקובץ '+f.name);
      }
    }
    renderDiscussionCard(host, school, gradeKey);
  });

  host.querySelectorAll('[data-att-remove]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const idx = parseInt(btn.getAttribute('data-att-remove'),10);
      d.attachments.splice(idx,1);
      renderDiscussionCard(host, school, gradeKey);
    });
  });

  host.querySelector('#dSaveBtn')?.addEventListener('click', async ()=>{
    gradeObj.updatedAt = Date.now();
    school.updatedAt = Date.now();
    await saveSchool(school);
    updateSchoolsListEntry(school);
    await saveSchoolsList();
    const status = host.querySelector('#dSaveStatus');
    if(status){ status.textContent = '✓ נשמר'; setTimeout(()=>{ if(status) status.textContent=''; }, 2500); }
  });
}


/* ---------------- BACKUP: export / import all data ---------------- */
async function exportAllData(){
  const bundle = {app:'maane-map-backup', version:1, exportedAt:Date.now(), schoolsList:schools, schoolsData:{}};
  for(const s of schools){
    const full = await loadSchool(s.id);
    if(full) bundle.schoolsData[s.id] = full;
  }
  const blob = new Blob([JSON.stringify(bundle,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const dateStr = new Date().toISOString().slice(0,10);
  a.href = url; a.download = 'גיבוי-מפת-מענים-'+dateStr+'.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

async function importAllDataFromFile(file){
  let text;
  try{ text = await file.text(); }catch(e){ alert('לא הצלחתי לקרוא את הקובץ.'); return; }
  let bundle;
  try{ bundle = JSON.parse(text); }catch(e){ alert('קובץ הגיבוי אינו קובץ JSON תקין.'); return; }
  if(!bundle || !Array.isArray(bundle.schoolsList) || typeof bundle.schoolsData !== 'object'){
    alert('מבנה קובץ הגיבוי לא מוכר – ודאו שזה קובץ שיובא מ"ייצוא גיבוי" של הכלי הזה.');
    return;
  }
  let added=0, skipped=[];
  for(const s of bundle.schoolsList){
    if(schools.some(x=>x.id===s.id)){ skipped.push(s.name); continue; }
    const full = bundle.schoolsData[s.id];
    if(full){
      const migrated = migrateSchoolShape(full);
      await saveSchool(migrated);
      schools.push({id:s.id, name:migrated.name, sector:migrated.sector, status:migrated.status, updatedAt:migrated.updatedAt, gradeCount:Object.keys(migrated.grades||{}).length});
    } else {
      schools.push({id:s.id, name:s.name, sector:s.sector, status:s.status, updatedAt:s.updatedAt, gradeCount:0});
    }
    added++;
  }
  await saveSchoolsList();
  let msg = added>0 ? `יובאו ${added} בתי ספר בהצלחה.` : 'לא נמצאו בתי ספר חדשים לייבוא.';
  if(skipped.length) msg += ` דולגו (כבר קיימים בכלי הזה): ${skipped.join(', ')}.`;
  alert(msg);
  view='home'; render();
}

/* ---------------- utils ---------------- */

function escapeHtml(str){
  return String(str||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(str){ return escapeHtml(str); }

/* ---------------- init ---------------- */
document.getElementById('btnHome').addEventListener('click', ()=>{ view='home'; render(); });
document.getElementById('btnExport').addEventListener('click', exportAllData);
document.getElementById('btnImport').addEventListener('click', ()=> document.getElementById('importFileInput').click());
document.getElementById('importFileInput').addEventListener('change', (e)=>{
  const file = e.target.files && e.target.files[0];
  if(file) importAllDataFromFile(file);
  e.target.value = '';
});

(async function init(){
  await loadSchools();
  render();
})();
</script>
